server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Locations with add_header replace inherited headers in nginx 1.28.
    include /etc/nginx/snippets/erp-security-headers.conf;

    # Custom runtime assets (icons etc.) mounted from the host into the
    # container (deploy: ./assets/custom -> /usr/share/nginx/html/assets/custom).
    # They must never be cached immutable: an override can appear at any time
    # without a rebuild, and the browser has to pick it up on the next load.
    location /assets/custom/ {
        include /etc/nginx/snippets/erp-security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Хэшированные ассеты сборки (JS/CSS/шрифты) иммутабельны: URL меняется
    # при изменении содержимого, поэтому их можно кэшировать в браузере
    # навсегда — повторные визиты не скачивают тяжёлые чанки (pdf.js, pdf-lib).
    location /assets/ {
        include /etc/nginx/snippets/erp-security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html без кэша: браузер всегда получает свежий HTML со ссылками на
    # актуальные хэшированные ассеты (старый кэш при новой сборке не цепляется).
    location = /index.html {
        include /etc/nginx/snippets/erp-security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Service Worker без кэша: браузер должен проверять sw.js при каждой навигации,
    # иначе офлайн-кэш навсегда застрянет на старой версии приложения.
    location = /sw.js {
        include /etc/nginx/snippets/erp-security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Манифест PWA тоже без кэша (меняется вместе с релизами).
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/erp-security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Список ассетов для precache Service Worker: меняется на каждой сборке,
    # браузер должен всегда получать актуальный (SW читает его при install/activate).
    location = /precache-manifest.json {
        include /etc/nginx/snippets/erp-security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
