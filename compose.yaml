# Preserve the established local project's volume namespace unless explicitly overridden.
name: ${COMPOSE_PROJECT_NAME:-erp-dev}
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?Set DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER:?Set DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["db_data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 20
  loki:
    image: grafana/loki:3.4.2
    command: -config.file=/etc/loki/local-config.yaml
    ports: ["127.0.0.1:3100:3100"]
    volumes: ["loki_data:/loki"]
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    ports: ["127.0.0.1:4317:4317", "127.0.0.1:16686:16686"]
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
  backend:
    profiles: [stack]
    image: koshsky/erp-backend:${BACKEND_VERSION:-v1.4.3}
    build:
      context: ./backend
      args:
        APP_VERSION: ${BACKEND_VERSION:-v1.4.3}
    environment:
      DATABASE_URL: postgres://${DATABASE_USER}:${DATABASE_PASSWORD}@db:5432/${DATABASE_NAME}?sslmode=disable
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
    volumes: ["./backend/config.yaml:/app/config.yaml:ro"]
    depends_on:
      db:
        condition: service_healthy
      loki:
        condition: service_started
      redis:
        condition: service_started
      jaeger:
        condition: service_started
  frontend:
    profiles: [stack]
    image: koshsky/erp-frontend:${FRONTEND_VERSION:-v1.6.3}
    build:
      context: ./frontend
      args:
        APP_VERSION: ${FRONTEND_VERSION:-1.6.3}
        VITE_API_URL: /api/v1
        VITE_API_BASE: /api/v1
  web:
    profiles: [stack]
    image: caddy:2-alpine
    ports: ["127.0.0.1:8088:80"]
    volumes: ["./deploy/Caddyfile:/etc/caddy/Caddyfile:ro"]
    depends_on: [backend, frontend]
volumes:
  db_data:
  loki_data:
