name: Backend
on:
  workflow_call:
    outputs:
      build_result:
        description: Build, vet and test job result
        value: ${{ jobs.backend.outputs.result }}
      lint_result:
        description: Lint job result
        value: ${{ jobs.backend-lint.outputs.result }}
permissions:
  contents: read
jobs:
  backend:
    name: Backend build, vet and tests
    runs-on: ubuntu-latest
    outputs:
      result: ${{ job.status }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    outputs:
      result: ${{ job.status }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # Both the linter's importer and its build toolchain must support Go 1.27.
      - run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...
        working-directory: backend
