name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend-changes:
    name: Is backend changed?
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: python3 scripts/ci.py detect
  frontend-changes:
    name: Is frontend changed?
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: python3 scripts/ci.py detect
  common-changes:
    name: Is API changed?
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: python3 scripts/ci.py detect
  backend:
    name: Backend
    needs: backend-changes
    if: needs.backend-changes.outputs.backend == 'true'
    uses: ./.github/workflows/ci-backend.yml
  frontend:
    name: Frontend
    needs: frontend-changes
    if: needs.frontend-changes.outputs.frontend == 'true'
    uses: ./.github/workflows/ci-frontend.yml
  common:
    name: Common checks
    needs: common-changes
    if: always()
    uses: ./.github/workflows/ci-common.yml
    with:
      check-api: ${{ needs.common-changes.outputs.api == 'true' }}
  required:
    name: All checks
    if: always()
    needs: [backend-changes, frontend-changes, common-changes, backend, frontend, common]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require all service checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci.py verify
