name: Frontend
on:
  workflow_call:
    outputs:
      checks_result:
        description: Frontend check and build job result
        value: ${{ jobs.frontend.outputs.result }}
      native_result:
        description: Native SQLite and ASAR checks on every supported OS
        value: ${{ jobs.native-gate.outputs.result }}
permissions:
  contents: read
jobs:
  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-latest
    outputs:
      result: ${{ job.status }}
    defaults:
      run:
        working-directory: frontend
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node scripts/desktop-api-routes.cjs --check
      - run: npm run check
      - run: npm run lint
      - run: npm run test:stories -- --project unit
      - run: node --test tests/security.test.cjs tests/desktop-service.test.cjs tests/platform-session.test.cjs tests/desktop-storage.test.cjs tests/app-version.test.cjs
      - run: npm run build
  native-storage:
    name: SQLite and ASAR (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/desktop/package-lock.json
      - run: npm ci --prefix frontend/desktop
      - name: Native storage and packaged worker on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node frontend/scripts/test-desktop-storage.cjs
      - name: Native storage and packaged worker on Windows/macOS
        if: runner.os != 'Linux'
        run: node frontend/scripts/test-desktop-storage.cjs
  native-gate:
    name: Native storage results
    if: always()
    needs: native-storage
    runs-on: ubuntu-latest
    outputs:
      result: ${{ job.status }}
    steps:
      - name: Require every native platform
        env:
          NATIVE_RESULT: ${{ needs.native-storage.result }}
        run: test "$NATIVE_RESULT" = success
