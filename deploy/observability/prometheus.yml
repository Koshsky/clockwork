global:
  scrape_interval: 30s
  scrape_timeout: 3s
  evaluation_interval: 30s
scrape_configs:
  - job_name: clockwork
    static_configs:
      - targets: [127.0.0.1:9091]
    metrics_path: /metrics
    sample_limit: 1900
    label_limit: 10
    label_name_length_limit: 64
    label_value_length_limit: 128
    body_size_limit: 1MB
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: '(clockwork_.*|go_.*)'
        action: keep
